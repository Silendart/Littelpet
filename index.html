<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='18' cy='16' r='9' fill='%23ffa86b' stroke='%23633a1c' stroke-width='3'/%3E%3Ccircle cx='46' cy='16' r='9' fill='%23ffa86b' stroke='%23633a1c' stroke-width='3'/%3E%3Cellipse cx='32' cy='36' rx='25' ry='23' fill='%23ffa86b' stroke='%23633a1c' stroke-width='3'/%3E%3Ccircle cx='24' cy='33' r='4' fill='%232a2140'/%3E%3Ccircle cx='40' cy='33' r='4' fill='%232a2140'/%3E%3Cpath d='M27 42q5 5 10 0' stroke='%232a2140' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Le Jardin des Pompons</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout : une scène plein écran façon console de poche ; barre du haut, jardin au centre, jauges et grosses touches en bas. */
:root{
  --ground:#efeafc;
  --panel:#ffffff;
  --ink:#2a2140;
  --ink-soft:#6c6492;
  --lilac:#7563ee;
  --lilac-soft:#e4ddff;
  --berry:#ff5c8a;
  --sun:#ffbb12;
  --leaf:#35b878;
  --line:#d8d0f4;
  --font:'Baloo 2', ui-rounded, 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
svg.ic{width:1em;height:1em;display:block}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* ---------- Accueil ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-weight:800;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;font-size:.95rem;font-weight:600;color:var(--ink-soft);letter-spacing:0;margin-top:4px}
.parent-btn{font-size:.85rem;font-weight:700;color:var(--ink-soft);padding:8px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--line)}
.parent-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.who{font-weight:700;font-size:1.15rem;color:var(--ink-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;overflow-y:auto;padding:4px 2px 12px;align-content:start}
.card{background:var(--panel);border-radius:28px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 10px 12px;gap:2px;position:relative;transition:transform .15s}
.card:active{transform:scale(.96)}
.card canvas{width:100%;aspect-ratio:1/0.9;max-width:100%;display:block}
.card .nm{font-weight:800;font-size:1.25rem;line-height:1.1}
.card .meta{font-size:.85rem;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:4px}
.card .meta svg{color:var(--sun);font-size:1rem}
.card.new{border-style:dashed;background:transparent;justify-content:center;min-height:200px;color:var(--lilac)}
.card.new .plus{width:72px;height:72px;border-radius:50%;background:var(--lilac);color:#fff;display:grid;place-items:center;font-size:2.4rem;font-weight:800;line-height:1}
.card.new .nm{font-size:1.05rem;color:var(--lilac);margin-top:8px}
.del{position:absolute;top:8px;right:8px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ground);color:var(--ink-soft)}
.del.sure{background:var(--berry);color:#fff}
.empty{background:var(--panel);border-radius:32px;border:3px solid var(--line);padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty canvas{width:200px;height:190px;max-width:100%}
.empty p{margin:0;color:var(--ink-soft);font-weight:600;max-width:32ch}

.big-btn{background:var(--lilac);color:#fff;font-weight:800;font-size:1.25rem;padding:12px 26px;border-radius:999px;box-shadow:0 5px 0 #4f3fc4;transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:10px}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4f3fc4}
.big-btn.alt{background:var(--panel);color:var(--lilac);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}

/* ---------- Atelier ---------- */
.create-top{display:flex;align-items:center;gap:10px}
.round-btn{width:48px;height:48px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:1.5rem;flex:none;color:var(--ink)}
.create-title{font-weight:800;font-size:1.4rem;line-height:1.1}
.create-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:10px;overflow-y:auto;padding-bottom:6px}
.preview{background:linear-gradient(#bfe6ff,#e8f6ff);border-radius:28px;border:3px solid var(--line);position:relative;min-height:200px;height:32vh;max-height:300px}
.preview canvas{width:100%;height:100%;display:block}
.opt{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt-label{font-weight:700;font-size:.95rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--lilac);transform:scale(1.08)}
.chip{width:72px;height:66px;border-radius:18px;background:var(--panel);border:3px solid var(--line);padding:2px}
.chip canvas{width:100%;height:100%;display:block}
.chip[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac-soft)}
.name-row{display:flex;gap:8px;align-items:center}
.name-row input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:1.4rem;padding:6px 16px;border-radius:18px;border:3px solid var(--line);background:var(--panel);color:var(--ink)}
.create-foot{display:flex;justify-content:center;padding:4px 0 2px}
@media (min-width:640px){
  .create-body{grid-template-columns:1fr 1fr;align-content:start}
  .preview{grid-row:span 4;height:auto;max-height:none;min-height:340px}
}

/* ---------- Jeu ---------- */
.topbar{display:flex;align-items:center;gap:10px}
.pet-name{flex:1;min-width:0;font-weight:800;font-size:1.45rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars-chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 10px;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stars-chip svg{color:var(--sun);font-size:1.4rem}
.stage{flex:1;min-height:220px;position:relative;border-radius:30px;overflow:hidden;border:3px solid var(--line);background:#bfe6ff;touch-action:none;user-select:none;-webkit-user-select:none}
.stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{position:absolute;left:58%;top:7%;width:74px;height:66px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 4px 0 rgba(42,33,64,.12);animation:float 2.4s ease-in-out infinite;pointer-events:none}
.bubble::before,.bubble::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bubble::before{width:18px;height:18px;left:4px;bottom:-12px}
.bubble::after{width:10px;height:10px;left:-6px;bottom:-24px}
.hint{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:1.25rem;padding:6px 18px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:pulse 1.4s ease-in-out infinite;display:flex;align-items:center;gap:8px}
.tray{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,.92);padding:8px;border-radius:24px;box-shadow:0 6px 0 rgba(42,33,64,.12)}
.tray button{width:64px;height:64px;border-radius:18px;background:var(--ground);display:grid;place-items:center}
.tray button:active{transform:scale(.9)}
.tray canvas{width:52px;height:52px}
.gamebar{position:absolute;left:16px;right:16px;top:14px;height:16px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;pointer-events:none}
.gamebar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:999px;transform-origin:left}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(42,33,64,.25);padding:16px}
.ov-card{background:var(--panel);border-radius:30px;padding:18px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:320px;box-shadow:0 8px 0 rgba(42,33,64,.18);animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.ov-art{font-size:4.5rem;color:var(--sun);display:flex;align-items:center;gap:6px;font-weight:800;line-height:1}
.ov-art span{font-size:3rem;color:var(--ink)}
.ov-title{margin:0;font-weight:800;font-size:1.5rem;line-height:1.15;text-wrap:balance}
.ov-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

.shop{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;padding:12px;gap:10px}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-head h2{margin:0;font-size:1.4rem;font-weight:800}
.shop-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start}
.item{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.item canvas{width:100%;aspect-ratio:1/0.85;max-width:100%}
.item .price{display:flex;align-items:center;gap:4px;font-weight:800;font-size:1.1rem}
.item .price svg{color:var(--sun)}
.item.owned .price{color:var(--leaf)}
.item.worn{border-color:var(--lilac);background:var(--lilac-soft)}
.item.poor{opacity:.55}
.item.shake{animation:shake .4s}

.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.need{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:16px;padding:6px 8px;border:2px solid var(--line);min-width:0}
.need .ic{font-size:1.5rem;flex:none}
.need .bar{flex:1;height:12px;border-radius:999px;background:var(--ground);overflow:hidden;min-width:0}
.need .bar i{display:block;height:100%;border-radius:999px;background:var(--leaf);transition:width .4s,background-color .4s}
.need.mid .bar i{background:var(--sun)}
.need.low .bar i{background:var(--berry)}
.need.low{animation:nudge 1.6s ease-in-out infinite}

.actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.act .disc{width:min(62px,13.5vw);height:min(62px,13.5vw);border-radius:50%;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;font-size:min(2rem,8vw);box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.act:active .disc{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.act[aria-pressed="true"] .disc{background:var(--lilac-soft);border-color:var(--lilac)}
.act:disabled{opacity:.35;cursor:default}
.c-apple{color:#f0533f}.c-heart{color:var(--berry)}.c-bubbles{color:#3aa8e8}.c-star{color:var(--sun)}.c-moon{color:#6a5ae0}.c-sun{color:#ff9d00}.c-bag{color:var(--leaf)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.act span{display:none}.needs{gap:5px}.need{padding:5px 6px}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>

<div id="app">

  <!-- ACCUEIL -->
  <section class="screen" id="scr-home">
    <div class="home-head">
      <div class="brand">Le Jardin des Pompons<small>Qui vient jouer ?</small></div>
      <button class="parent-btn" id="parentBtn" aria-pressed="false">Parents</button>
    </div>
    <div id="homeBody" class="cards"></div>
  </section>

  <!-- ATELIER DE CRÉATION -->
  <section class="screen" id="scr-create" hidden>
    <div class="create-top">
      <button class="round-btn" id="createBack" aria-label="Retour"><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="create-title">Invente ton Pompon</div>
    </div>
    <div class="create-body">
      <div class="preview"><canvas id="cvPreview"></canvas></div>
      <div class="opt"><div class="opt-label">Couleur</div><div class="row" id="optColor"></div></div>
      <div class="opt"><div class="opt-label">Oreilles</div><div class="row" id="optEars"></div></div>
      <div class="opt"><div class="opt-label">Motif</div><div class="row" id="optPattern"></div></div>
      <div class="opt"><div class="opt-label">Yeux</div><div class="row" id="optEyes"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ================= DONNÉES ================= */
const NEED_KEYS = ['faim', 'energie', 'joie', 'propre'];
const NEED_ICON = { faim: 'i-apple', energie: 'i-moon', joie: 'i-heart', propre: 'i-bubbles' };

const NEED_LABEL = { faim: 'Ventre', energie: 'Forme', joie: 'Joie', propre: 'Propre' };
const COLORS = [
  { h: 345, s: 82, l: 80 }, { h: 205, s: 82, l: 74 }, { h: 150, s: 52, l: 68 }, { h: 48, s: 95, l: 66 },
  { h: 268, s: 68, l: 79 }, { h: 22, s: 92, l: 72 }, { h: 178, s: 52, l: 64 }, { h: 30, s: 32, l: 64 }

const PATTERNS = ['aucun', 'taches', 'rayures', 'etoiles'];
const EYES = ['ronds', 'brillants', 'petits'];
const ITEMS = [
  { id: 'noeud', price: 5 }, { id: 'fete', price: 6 }, { id: 'fleur', price: 8 },
  { id: 'lunettes', price: 10 }, { id: 'echarpe', price: 12 }, { id: 'couronne', price: 20 }
];
const STAGE_SCALE = { egg: .9, baby: .62, kid: .82, adult: 1 };
const EVOLVE_AT = { baby: 20, kid: 60 };
const TRAIT_OF = { feed: 'dodu', bath: 'brillant', play: 'sauteur', hug: 'calin' };
const FOODS = {
  pomme: { faim: 22, joie: 3 }, carotte: { faim: 20, joie: 2 },
  gateau: { faim: 14, joie: 14 }, lait: { faim: 18, energie: 6 }
};
const SYL = ['bu', 'lo', 'pi', 'mi', 'no', 'pa', 'zou', 'ki', 'fi', 'mo', 'lu', 'pom', 'to', 'ri', 'na', 'bi', 'do', 'li', 'nou', 'pou'];
function randName() {
  let n = SYL[rnd(SYL.length)] + SYL[rnd(SYL.length)];
  if (Math.random() < .25) n += Math.random() < .5 ? 'tte' : 'n';
  return n[0].toUpperCase() + n.slice(1);
}
const isNight = () => { const h = new Date().getHours(); return h >= 20 || h < 7; };

function newPet(d) {
  const now = Date.now();
  return {
    id: 'p' + now.toString(36) + Math.random().toString(36).slice(2, 6),
    name: d.name, color: d.color, ears: d.ears, pattern: d.pattern, eyes: d.eyes,
    stage: 'egg', taps: 0, born: null,
    needs: { faim: 80, energie: 85, joie: 80, propre: 90 },
    care: { feed: 0, bath: 0, play: 0, hug: 0, sleep: 0 }, soins: 0, trait: null,
    poops: [], asleep: false, last: now, stars: 3, items: [], wearing: null
  };
}
function normalize(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.pets)) s = { v: 1, pets: [], savedAt: 0 };
  s.pets = s.pets.filter(p => p && p.id && p.color).map(p => {
    p.needs = Object.assign({ faim: 70, energie: 70, joie: 70, propre: 70 }, p.needs || {});
    p.care = Object.assign({ feed: 0, bath: 0, play: 0, hug: 0, sleep: 0 }, p.care || {});
    p.poops = Array.isArray(p.poops) ? p.poops : [];
    p.items = Array.isArray(p.items) ? p.items : [];
    p.stars = p.stars | 0; p.soins = p.soins | 0;
    if (!STAGE_SCALE[p.stage]) p.stage = 'egg';
    if (!p.last) p.last = Date.now();
    return p;
  });
  return s;
}

/* ================= SAUVEGARDE ================= */
const LS_KEY = 'jardin-pompons-v1', LS_SOUND = 'jardin-pompons-son';
function lsLoad() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSave(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {} }
let state = normalize(lsLoad());
let saveTimer = null;

function markDirty() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1500); }
function saveNow() {
  clearTimeout(saveTimer);
  state.savedAt = Date.now();
  lsSave(state);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state.pets.length) { if (cur) applyTime(cur, Date.now(), false); saveNow(); } });

/* ================= SONS ================= */
let actx = null;
let muted = false; try { muted = localStorage.getItem(LS_SOUND) === 'off'; } catch (e) {}
function ac() {
  if (muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d = .12, type = 'sine', v = .14, when = 0, slide = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);

}
const sfx = {
  tap: () => tone(660, .08, 'triangle', .1),
  giggle: () => [0, 1, 2, 3].forEach(i => tone(720 + i * 110, .09, 'sine', .12, i * .08, 1.25)),
  munch: () => [0, 1, 2].forEach(i => tone(170 + rnd(40), .07, 'sawtooth', .05, i * .2, .6)),
  pop: () => tone(880, .08, 'triangle', .1, 0, .5),
  sparkle: () => [0, 1, 2].forEach(i => tone(1300 + i * 320, .1, 'sine', .07, i * .06)),
  star: () => tone(1046, .14, 'triangle', .12, 0, 1.5),
  fanfare: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .13, i * .13)),
  no: () => { tone(330, .12, 'square', .04); tone(262, .16, 'square', .04, .13); },
  yawn: () => tone(520, .7, 'sine', .08, 0, .45),
  crack: () => { tone(240, .06, 'square', .06, 0, .5); tone(180, .05, 'square', .05, .05, .5); },
  splash: () => [0, 1, 2, 3].forEach(i => tone(600 + rnd(500), .06, 'sine', .06, i * .05, 1.6)),
  prout: () => tone(120, .25, 'sawtooth', .05, 0, .7)

/* ================= DESSIN ================= */
const hsl = (c, dl = 0, ds = 0, a = 1) => `hsla(${c.h},${clamp(c.s + ds, 0, 100)}%,${clamp(c.l + dl, 0, 100)}%,${a})`;
function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function starPath(ctx, x, y, r, ri = .45, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * ri : r, a = rot + i * Math.PI / n; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function heartPath(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .8);
  ctx.bezierCurveTo(x - s * 1.25, y - s * .05, x - s * .6, y - s * 1.05, x, y - s * .38);
  ctx.bezierCurveTo(x + s * .6, y - s * 1.05, x + s * 1.25, y - s * .05, x, y + s * .8);
  ctx.closePath();
}
const INK = '#2a2140';

function drawPet(ctx, p, x, y, R, t, o = {}) {
  const c = p.color, body = hsl(c), dark = hsl(c, -13, 4), light = hsl(c, 13, -14), line = hsl(c, -44, 6);
  const accent = { h: (c.h + 45) % 360, s: 85, l: 68 };
  const big = p.stage === 'adult';
  const breath = Math.sin(t * 2.4) * .03;
  const wide = p.trait === 'dodu' ? (big ? 1.2 : 1.1) : 1;
  const rx = R * wide * (1 + breath * .6), ry = R * .9 * (1 - breath);
  const lw = Math.max(2, R * .055);
  ctx.save(); ctx.translate(x, y + (o.dy || 0)); if (o.tilt) ctx.rotate(o.tilt);
  ctx.lineWidth = lw; ctx.strokeStyle = line; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // ailes
  if (p.trait === 'sauteur') {
    const f = Math.sin(t * (o.flap ? 18 : 4)) * .22, ws = big ? 1.3 : 1;
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(s * rx * .78, -ry * .25); ctx.rotate(s * (-.35 + f));
      ell(ctx, s * R * .3 * ws, -R * .05, R * .36 * ws, R * .2 * ws, s * -.3); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill(); ctx.stroke();
      ell(ctx, s * R * .34 * ws, -R * .02, R * .2 * ws, R * .08 * ws, s * -.3); ctx.fillStyle = hsl(accent, 15, -30, .6); ctx.fill();
      ctx.restore();
    }
  }
  // oreilles
  const ear = p.ears;
  if (ear === 'rondes') {
    for (const s of [-1, 1]) { ell(ctx, s * rx * .58, -ry * .74, R * .25, R * .25); ctx.fillStyle = body; ctx.fill(); ctx.stroke(); ell(ctx, s * rx * .58, -ry * .74, R * .13, R * .13); ctx.fillStyle = light; ctx.fill(); }
  } else if (ear === 'pointues') {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * rx * .18, -ry * .82); ctx.lineTo(s * rx * .62, -ry * 1.34); ctx.lineTo(s * rx * .84, -ry * .42); ctx.closePath(); ctx.fillStyle = body; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * rx * .38, -ry * .78); ctx.lineTo(s * rx * .6, -ry * 1.12); ctx.lineTo(s * rx * .71, -ry * .6); ctx.closePath(); ctx.fillStyle = light; ctx.fill();
    }
  } else if (ear === 'lapin') {
    const w = Math.sin(t * 1.7) * .06;
    for (const s of [-1, 1]) { ell(ctx, s * rx * .34, -ry * 1.16, R * .17, R * .48, s * (.22 + w)); ctx.fillStyle = body; ctx.fill(); ctx.stroke(); ell(ctx, s * rx * .35, -ry * 1.14, R * .08, R * .33, s * (.22 + w)); ctx.fillStyle = light; ctx.fill(); }
  } else if (ear === 'antennes') {
    for (const s of [-1, 1]) {
      const bob = Math.sin(t * 3 + s) * R * .04;
      ctx.beginPath(); ctx.moveTo(s * rx * .22, -ry * .86); ctx.quadraticCurveTo(s * rx * .28, -ry * 1.3, s * rx * .5, -ry * 1.42 + bob); ctx.stroke();
      ell(ctx, s * rx * .5, -ry * 1.42 + bob, R * .11, R * .11); ctx.fillStyle = hsl(accent); ctx.fill(); ctx.stroke();
    }
  } else {
    for (const i of [-1, 0, 1]) { ell(ctx, i * R * .17, -ry * .98 - (i === 0 ? R * .06 : 0), R * .1, R * .22, i * .5); ctx.fillStyle = body; ctx.fill(); ctx.stroke(); }
  }
  // pieds
  for (const s of [-1, 1]) { ell(ctx, s * rx * .42, ry * .9, R * .26, R * .15); ctx.fillStyle = dark; ctx.fill(); ctx.stroke(); }
  // corps
  ell(ctx, 0, 0, rx, ry); ctx.fillStyle = body; ctx.fill();
  ctx.save(); ell(ctx, 0, 0, rx, ry); ctx.clip();
  if (p.pattern === 'taches') { ctx.fillStyle = dark; for (const [a, b, r] of [[-.55, -.45, .2], [.5, -.55, .15], [.7, .12, .13], [-.74, .2, .11], [.12, -.84, .09]]) { ell(ctx, a * rx, b * ry, r * R, r * R * .85); ctx.fill(); } }
  else if (p.pattern === 'rayures') { ctx.fillStyle = dark; for (const a of [-.32, 0, .32]) { ell(ctx, a * rx, -ry * .96, R * .075, R * .4); ctx.fill(); } }
  else if (p.pattern === 'etoiles') { ctx.fillStyle = light; for (const [a, b, r] of [[-.6, -.4, .11], [.55, -.52, .09], [.74, .18, .08], [-.78, .22, .07], [.06, -.78, .07]]) { starPath(ctx, a * rx, b * ry, r * R); ctx.fill(); } }
  ell(ctx, 0, ry * .44, rx * .6, ry * .52); ctx.fillStyle = light; ctx.fill();
  if (p.wearing === 'echarpe') {
    ctx.fillStyle = '#ff7a59'; ctx.fillRect(-rx, ry * .27, rx * 2, R * .17);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; for (let i = -4; i <= 4; i++) ctx.fillRect(i * R * .22, ry * .27, R * .07, R * .17);
  }
  ctx.restore();
  ell(ctx, 0, 0, rx, ry); ctx.stroke();
  if (p.wearing === 'echarpe') {
    ctx.save(); ctx.translate(rx * .38, ry * .38); ctx.rotate(.18);
    ctx.fillStyle = '#ff7a59'; ctx.beginPath(); ctx.roundRect(-R * .07, 0, R * .15, R * .4, R * .04); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if (p.trait === 'calin') { heartPath(ctx, 0, ry * .46, R * (big ? .2 : .15)); ctx.fillStyle = '#ff6f91'; ctx.fill(); }
  // bras
  const wave = o.wave ? Math.sin(t * 14) * .6 : 0;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(s * rx * .92, ry * .12); ctx.rotate(s * (.55 + (s > 0 ? -Math.abs(wave) : 0)));
    ell(ctx, 0, 0, R * .12, R * .21); ctx.fillStyle = body; ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // visage
  const mood = o.mood || 'happy';
  const ex = rx * .34, ey = -ry * .12;
  const er = R * (p.eyes === 'brillants' ? .15 : p.eyes === 'petits' ? .075 : .12);
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, R * .05);
  for (const s of [-1, 1]) {
    const cx = s * ex + (o.look || 0) * er * .3;
    if (mood === 'sleep') { ctx.beginPath(); ctx.arc(cx, ey, er * .85, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
    else if (mood === 'love' || mood === 'eat') { ctx.beginPath(); ctx.arc(cx, ey + er * .5, er * .85, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); }
    else if (o.blink) { ctx.beginPath(); ctx.moveTo(cx - er * .8, ey); ctx.lineTo(cx + er * .8, ey); ctx.stroke(); }
    else {
      ell(ctx, cx, ey, er, er * (p.eyes === 'petits' ? 1 : 1.1)); ctx.fill();
      if (p.eyes !== 'petits') {
        ctx.fillStyle = '#fff'; ell(ctx, cx + er * .35, ey - er * .38, er * .34, er * .34); ctx.fill();
        if (p.eyes === 'brillants') { ell(ctx, cx - er * .35, ey + er * .4, er * .17, er * .17); ctx.fill(); }
        ctx.fillStyle = INK;
      }
      if (mood === 'sad') { ctx.beginPath(); ctx.moveTo(cx - s * er * 1.1, ey - er * 2); ctx.lineTo(cx + s * er * .6, ey - er * 1.5); ctx.stroke(); }
    }
  }
  ctx.fillStyle = 'rgba(255,105,140,.45)';
  for (const s of [-1, 1]) { ell(ctx, s * rx * .6, ry * .1, R * .11, R * .065); ctx.fill(); }
  const my = ry * .14;
  ctx.fillStyle = INK; ctx.strokeStyle = INK;
  if (mood === 'eat') { const op = Math.abs(Math.sin(t * 11)); ell(ctx, 0, my + R * .02, R * .1, R * (.02 + .09 * op)); ctx.fill(); }
  else if (mood === 'love') { ctx.beginPath(); ctx.arc(0, my - R * .02, R * .12, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ff8fab'; ell(ctx, 0, my + R * .06, R * .06, R * .035); ctx.fill(); }
  else if (mood === 'sad') { ctx.beginPath(); ctx.arc(0, my + R * .1, R * .09, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
  else if (mood === 'sleep') { ell(ctx, 0, my + R * .03, R * .04, R * .05); ctx.fill(); }
  else if (mood === 'no') { ctx.beginPath(); ctx.moveTo(-R * .09, my + R * .03); ctx.quadraticCurveTo(-R * .03, my - R * .02, 0, my + R * .03); ctx.quadraticCurveTo(R * .03, my + R * .08, R * .09, my + R * .03); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0, my - R * .03, R * .1, .18 * Math.PI, .82 * Math.PI); ctx.stroke(); }

  // crête scintillante
  if (p.trait === 'brillant') {
    const sz = big ? 1.3 : 1, tw = .85 + Math.sin(t * 5) * .15;
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#d99a00'; ctx.lineWidth = Math.max(1.5, R * .03);
    for (const [a, b, r] of [[0, -1.12, .13], [-.3, -1.02, .08], [.3, -1.02, .08]]) { starPath(ctx, a * rx, b * ry, r * R * sz * tw); ctx.fill(); ctx.stroke(); }
  }

  drawWear(ctx, p.wearing, rx, ry, R, ex, ey, er, lw);
  ctx.restore();
}

function drawWear(ctx, w, rx, ry, R, ex, ey, er, lw) {
  if (!w || w === 'echarpe') return;
  ctx.lineWidth = lw; ctx.strokeStyle = INK;
  if (w === 'noeud') {
    ctx.save(); ctx.translate(rx * .5, -ry * .82); ctx.rotate(.3); ctx.fillStyle = '#ff5c8a';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * R * .3, -R * .17); ctx.lineTo(s * R * .3, R * .17); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ell(ctx, 0, 0, R * .08, R * .08); ctx.fill(); ctx.stroke(); ctx.restore();
  } else if (w === 'fete') {
    ctx.save(); ctx.translate(0, -ry * .86); ctx.rotate(-.12);
    ctx.beginPath(); ctx.moveTo(-R * .25, 0); ctx.lineTo(R * .25, 0); ctx.lineTo(0, -R * .62); ctx.closePath(); ctx.fillStyle = '#5ec8ff'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#ffd23f'; for (let i = 0; i < 3; i++) ctx.fillRect(-R * .3, -R * (.12 + i * .2), R * .6, R * .07); ctx.restore();
    ctx.stroke(); ctx.fillStyle = '#ff5c8a'; ell(ctx, 0, -R * .64, R * .09, R * .09); ctx.fill(); ctx.stroke(); ctx.restore();
  } else if (w === 'fleur') {
    ctx.save(); ctx.translate(-rx * .5, -ry * .8);
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; ell(ctx, Math.cos(a) * R * .12, Math.sin(a) * R * .12, R * .1, R * .1); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); }
    ell(ctx, 0, 0, R * .08, R * .08); ctx.fillStyle = '#ffc928'; ctx.fill(); ctx.stroke(); ctx.restore();
  } else if (w === 'lunettes') {
    const gr = Math.max(er * 1.8, R * .19);
    for (const s of [-1, 1]) { ell(ctx, s * ex, ey, gr, gr * .9); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(); ctx.strokeStyle = '#7563ee'; ctx.lineWidth = lw * 1.2; ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-ex + gr, ey); ctx.quadraticCurveTo(0, ey - gr * .4, ex - gr, ey); ctx.stroke();
  } else if (w === 'couronne') {
    ctx.save(); ctx.translate(0, -ry * .86);

function drawEgg(ctx, p, x, y, R, t, o = {}) {

    ctx.stroke();

}

function drawFood(ctx, f, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.lineWidth = Math.max(1.5, s * .06); ctx.strokeStyle = INK; ctx.lineJoin = 'round';
  if (f === 'pomme') {
    ell(ctx, -s * .22, s * .05, s * .45, s * .48); ctx.fillStyle = '#f0533f'; ctx.fill();
    ell(ctx, s * .22, s * .05, s * .45, s * .48); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -s * .38); ctx.lineTo(s * .05, -s * .65); ctx.strokeStyle = '#7a4a2a'; ctx.stroke();
    ell(ctx, s * .2, -s * .58, s * .18, s * .09, -.4); ctx.fillStyle = '#35b878'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(ctx, -s * .35, -s * .1, s * .08, s * .15); ctx.fill();
  } else if (f === 'carotte') {
    ctx.rotate(.5);
    ctx.beginPath(); ctx.moveTo(-s * .25, -s * .45); ctx.quadraticCurveTo(0, -s * .55, s * .25, -s * .45); ctx.lineTo(0, s * .7); ctx.closePath(); ctx.fillStyle = '#ff9a2e'; ctx.fill();

  } else if (f === 'gateau') {
    ctx.beginPath(); ctx.moveTo(-s * .55, s * .45); ctx.lineTo(s * .55, s * .45); ctx.lineTo(s * .55, -s * .05); ctx.lineTo(-s * .55, -s * .3); ctx.closePath(); ctx.fillStyle = '#ffe2b0'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * .55, -s * .3); ctx.lineTo(s * .55, -s * .05); ctx.lineTo(s * .55, s * .1); ctx.quadraticCurveTo(s * .3, s * .2, s * .1, s * .05); ctx.quadraticCurveTo(-s * .2, -s * .05, -s * .55, -s * .15); ctx.closePath(); ctx.fillStyle = '#ff8fb8'; ctx.fill();

function drawPoop(ctx, x, y, s, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3 + x) * 1.5);
  ctx.fillStyle = '#a46a3f'; ctx.strokeStyle = '#6e4325'; ctx.lineWidth = Math.max(1.5, s * .07);

}

// décor : graines fixes pour étoiles, fleurs et nuages
const SKY_STARS = Array.from({ length: 40 }, () => [Math.random(), Math.random() * .6, .6 + Math.random() * 1.4, Math.random() * 6]);
const FLOWERS = Array.from({ length: 9 }, (_, i) => [(i + .5) / 9 + (Math.random() - .5) * .06, .84 + Math.random() * .12, [0, 48, 200, 280][rnd(4)]]);
function drawScene(ctx, W, H, t, night) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (night) { g.addColorStop(0, '#1c2160'); g.addColorStop(1, '#4b4387'); } else { g.addColorStop(0, '#94d3ff'); g.addColorStop(1, '#e6f6ff'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  if (night) {
    for (const [a, b, r, ph] of SKY_STARS) { ctx.fillStyle = `rgba(255,248,210,${.5 + .5 * Math.sin(t * 2 + ph)})`; ell(ctx, a * W, b * H, r, r); ctx.fill(); }
    ctx.fillStyle = '#fff3b8'; ell(ctx, W * .82, H * .16, m * .07, m * .07); ctx.fill();
    ctx.fillStyle = '#1f2465'; ell(ctx, W * .82 + m * .035, H * .16 - m * .02, m * .062, m * .062); ctx.fill();
  } else {
    ctx.save(); ctx.translate(W * .85, H * .14); ctx.rotate(t * .2);
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = m * .012; ctx.lineCap = 'round';
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10; ctx.beginPath(); ctx.moveTo(Math.cos(a) * m * .085, Math.sin(a) * m * .085); ctx.lineTo(Math.cos(a) * m * .115, Math.sin(a) * m * .115); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#ffd23f'; ell(ctx, W * .85, H * .14, m * .065, m * .065); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const [k, yy, sz] of [[0, .14, 1], [.5, .27, .75]]) {
      const cx = ((t * 8 * (1 + k) + k * W * 1.3) % (W + 220)) - 110, cy = H * yy, s = m * .07 * sz;
      ell(ctx, cx, cy, s * 1.4, s * .7); ctx.fill(); ell(ctx, cx - s * .8, cy + s * .15, s * .8, s * .5); ctx.fill(); ell(ctx, cx + s * .5, cy - s * .3, s * .8, s * .6); ctx.fill();
    }
  }
  ctx.fillStyle = night ? '#2b5f55' : '#a6e6a1'; ell(ctx, W * .15, H * 1.0, W * .7, H * .3); ctx.fill();
  ctx.fillStyle = night ? '#346c5d' : '#8fdc8c'; ell(ctx, W * .9, H * 1.02, W * .7, H * .34); ctx.fill();
  ctx.fillStyle = night ? '#3a7764' : '#7fd283'; ell(ctx, W * .5, H * 1.22, W * 1.05, H * .44); ctx.fill();
  for (const [a, b, h] of FLOWERS) {
    const fx = a * W, fy = b * H; if (Math.abs(fx - W / 2) < W * .2) continue;
    ctx.fillStyle = night ? 'rgba(255,255,255,.35)' : `hsl(${h},85%,72%)`;
    for (let i = 0; i < 5; i++) { const an = i * TAU / 5; ell(ctx, fx + Math.cos(an) * 4, fy + Math.sin(an) * 4, 3.5, 3.5); ctx.fill(); }
    ctx.fillStyle = night ? 'rgba(255,240,180,.5)' : '#ffd23f'; ell(ctx, fx, fy, 2.6, 2.6); ctx.fill();
  }
}

function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
  return { ctx, W: r.width, H: r.height };
}
function drawPetFit(cv, p, t = 0, o = {}) {
  const { ctx, W, H } = fitCanvas(cv);
  ctx.clearRect(0, 0, W, H);
  const sc = o.fullSize ? 1 : (STAGE_SCALE[p.stage] || 1) * .85 + .15;
  const R = Math.min(W * .27, H * .3) * sc;
  if (o.ground) { ctx.fillStyle = '#a6e6a1'; ell(ctx, W / 2, H * .92, W * .45, H * .12); ctx.fill(); }
  if (p.stage === 'egg') drawEgg(ctx, p, W / 2, H * .55, Math.min(W * .3, H * .34), t, { taps: p.taps });
  else drawPet(ctx, p, W / 2, H * .6, R, t, o);
}

/* ---- Temps qui passe ---- */
function applyTime(p, now, away) {
  if (p.stage === 'egg') { p.last = now; return; }
  let h = (now - (p.last || now)) / 3.6e6;
  if (h <= 0) { p.last = now; return; }
  h = Math.min(h, 72);
  const n = p.needs;
  if (p.asleep) { n.energie += 20 * h; n.faim -= 3 * h; n.joie -= 1.5 * h; n.propre -= 1.5 * h; }
  else { n.energie -= 5 * h; n.faim -= 6 * h; n.joie -= 5 * h; n.propre -= 3 * h; }
  if (away && h > .05 && !p.asleep) {
    const k = Math.min(3 - p.poops.length, Math.floor(h / 5));
    for (let i = 0; i < k; i++) addPoop(p, true);
  }
  for (const k of NEED_KEYS) n[k] = clamp(n[k], away ? 12 : 8, 100);
  if (away && p.asleep && !isNight() && n.energie >= 99) p.asleep = false;
  p.last = now;
}
function addPoop(p, silent) {
  if (p.poops.length >= 3) return;
  let x; do { x = (Math.random() < .5 ? -1 : 1) * (.45 + Math.random() * .5); } while (p.poops.some(q => Math.abs(q.x - x) < .2));
  p.poops.push({ x: +x.toFixed(2) });
  p.needs.propre = clamp(p.needs.propre - 6, 8, 100);
  if (!silent) { sfx.prout(); markDirty(); }
}

/* ---- Soins & évolution ---- */
function soin(type) {
  cur.care[type] = (cur.care[type] || 0) + 1; cur.soins++;
  markDirty();
  if (fx.mode !== 'game') checkEvolve();
}
function checkEvolve() {
  if (!cur) return;
  const next = cur.stage === 'baby' && cur.soins >= EVOLVE_AT.baby ? 'kid' : cur.stage === 'kid' && cur.soins >= EVOLVE_AT.kid ? 'adult' : null;
  if (!next) return;
  if (!cur.trait) {
    let best = 'hug', bv = -1;
    for (const k of ['hug', 'feed', 'play', 'bath']) if ((cur.care[k] || 0) > bv) { bv = cur.care[k] || 0; best = k; }
    cur.trait = TRAIT_OF[best];
  }
  cur.stage = next; saveNow();
  setTimeout(() => {
    burst('confetti', 40); sfx.fanfare(); jump(.8, .5);
    showOv({ art: '', title: next === 'kid' ? `Waouh ! ${cur.name} a grandi !` : `${cur.name} est devenu tout grand !`, buttons: [{ label: 'Youpi !', fn: closeOverlays }] });
  }, 700);
}

/* ---- Particules ---- */
function spawn(type, x, y, o = {}) {
  parts.push(Object.assign({ type, x, y, vx: (Math.random() - .5) * 60, vy: -60 - Math.random() * 50, g: 0, life: 0, max: 1.2, size: 10, rot: Math.random() * 6, vr: (Math.random() - .5) * 5, hue: rnd(360) }, o));
}
function burst(type, n) {
  const { px, py, R } = geo;
  for (let i = 0; i < n; i++) {
    if (type === 'confetti') spawn('confetti', geo.W * Math.random(), -10, { vx: (Math.random() - .5) * 60, vy: 40 + Math.random() * 80, g: 60, max: 2.6, size: 6 + Math.random() * 5 });
    else if (type === 'heart') spawn('heart', px + (Math.random() - .5) * R, py - R * .6, { vy: -70 - Math.random() * 50, max: 1.3, size: 9 + Math.random() * 7 });
    else if (type === 'sparkle') spawn('sparkle', px + (Math.random() - .5) * R * 2, py + (Math.random() - .5) * R * 1.6, { vx: 0, vy: -20, max: .9, size: 6 + Math.random() * 7 });
    else if (type === 'crumb') spawn('crumb', px + (Math.random() - .5) * R * .3, py + R * .15, { g: 380, vy: -80 - Math.random() * 60, max: 1, size: 2.5 + Math.random() * 2.5, hue: 30 });
  }
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.rot += q.vr * dt;
    if (q.type === 'bubble' || q.type === 'zzz') q.x += Math.sin(q.life * 4 + q.rot) * 20 * dt;
    if (q.life > q.max) parts.splice(i, 1);
  }
}
function drawParts(ctx) {
  for (const q of parts) {
    const a = clamp(1 - q.life / q.max, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(q.x, q.y);
    if (q.type === 'heart') { heartPath(ctx, 0, 0, q.size); ctx.fillStyle = '#ff5c8a'; ctx.fill(); }
    else if (q.type === 'sparkle') { ctx.rotate(q.rot); starPath(ctx, 0, 0, q.size, .4, 4); ctx.fillStyle = '#ffd23f'; ctx.fill(); }
    else if (q.type === 'bubble') { ell(ctx, 0, 0, q.size, q.size); ctx.fillStyle = 'rgba(200,235,255,.35)'; ctx.fill(); ctx.strokeStyle = 'rgba(80,170,230,.8)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = '#fff'; ell(ctx, -q.size * .35, -q.size * .35, q.size * .22, q.size * .22); ctx.fill(); }
    else if (q.type === 'crumb') { ell(ctx, 0, 0, q.size, q.size); ctx.fillStyle = '#e7b16a'; ctx.fill(); }
    else if (q.type === 'confetti') { ctx.rotate(q.rot); ctx.fillStyle = `hsl(${q.hue},85%,62%)`; ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2); }
    else if (q.type === 'zzz') { ctx.fillStyle = '#fff'; ctx.font = `800 ${q.size}px ${getComputedStyle(document.body).fontFamily}`; ctx.fillText('z', 0, 0); }
    ctx.restore();
  }
}

/* ---- Humeur ---- */
function moodOf(p) {
  if (p.asleep) return 'sleep';
  return Math.min(...NEED_KEYS.map(k => p.needs[k])) < 30 ? 'sad' : 'happy';
}
function setMood(m, dur) { fx.mood = m; fx.moodUntil = now() + dur; }
function jump(h = .35, dur = .5) { fx.jumpStart = now(); fx.jumpH = h; fx.jumpDur = dur; }
const now = () => performance.now() / 1000;

/* ---- Actions ---- */
$('#actions').addEventListener('click', e => {
  const b = e.target.closest('.act'); if (!b || b.disabled || !cur) return;
  const a = b.dataset.act;
  if (a === 'feed') toggleFeed();
  else if (a === 'hug') hug();
  else if (a === 'bath') toggleBath();
  else if (a === 'play') tryPlay();
  else if (a === 'sleep') toggleSleep();
  else if (a === 'shop') openShop();
});

function toggleFeed() {
  if (fx.mode === 'feed') { fx.mode = null; $('#tray').hidden = true; refreshUI(); return; }
  stopBath(); fx.mode = 'feed'; sfx.tap();
  const tr = $('#tray'); tr.innerHTML = '';
  for (const f of Object.keys(FOODS)) {
    const b = document.createElement('button'); b.setAttribute('aria-label', f);
    const c = document.createElement('canvas'); b.appendChild(c); tr.appendChild(b);
    b.onclick = () => giveFood(f, b);
    requestAnimationFrame(() => { const { ctx, W, H } = fitCanvas(c); ctx.clearRect(0, 0, W, H); drawFood(ctx, f, W / 2, H / 2 + 2, W * .42); });
  }
  tr.hidden = false; refreshUI();
}
function giveFood(f, btn) {
  if (fx.fly || !cur || cur.asleep) return;
  const sr = stage.getBoundingClientRect(), br = btn.getBoundingClientRect();
  fx.fly = { f, t: 0, dur: .55, x0: br.left + br.width / 2 - sr.left, y0: br.top + br.height / 2 - sr.top };
  sfx.pop();
}
function landFood(f) {
  const n = cur.needs;
  if (n.faim >= 95) { setMood('no', 1.1); sfx.no(); burst('crumb', 4); return; }
  const before = n.faim, e = FOODS[f];
  setMood('eat', 1.4); sfx.munch();
  let k = 0; const crumbs = setInterval(() => { burst('crumb', 3); if (++k > 3) clearInterval(crumbs); }, 300);
  setTimeout(() => {
    if (!cur) return;
    for (const key of Object.keys(e)) n[key] = clamp(n[key] + e[key], 0, 100);
    setMood('love', .9); sfx.giggle(); burst('heart', 3);
    if (before < 90) soin('feed');
    if (Math.random() < .35) fx.nextPoopAt = now() + 12 + Math.random() * 15;
    refreshUI();
  }, 1400);
}
function hug() {
  if (!cur || cur.stage === 'egg') return;
  if (cur.asleep) { spawn('zzz', geo.px + geo.R * .5, geo.py - geo.R * .8, { vx: 10, vy: -30, max: 1.6, size: 20 }); return; }
  const n = cur.needs, before = n.joie;
  n.joie = clamp(n.joie + 10, 0, 100);
  setMood('love', 1.2); jump(.18, .35); burst('heart', 5); sfx.giggle();
  if (before < 90 && now() - fx.lastHugSoin > 2) { fx.lastHugSoin = now(); soin('hug'); }
  refreshUI();
}
function toggleBath() {
  if (fx.mode === 'bath') { stopBath(); refreshUI(); return; }
  if (fx.mode === 'feed') { $('#tray').hidden = true; }
  fx.mode = 'bath'; fx.bathStart = cur.needs.propre; fx.rub = 0; sfx.splash();
  setHint('Frotte ton Pompon !'); refreshUI();
}
function stopBath(done) {
  if (fx.mode !== 'bath') return;
  fx.mode = null; setHint(null);
  if (done) { burst('sparkle', 14); sfx.sparkle(); setMood('love', 1.2); jump(.25, .45); if (fx.bathStart < 90) soin('bath'); }
}
function rubAt(x, y, dist) {
  const { px, py, R } = geo;
  if (Math.hypot(x - px, y - py) > R * 1.25) return;
  fx.rub += dist;
  while (fx.rub > 16) {
    fx.rub -= 16;
    spawn('bubble', x + (Math.random() - .5) * 30, y + (Math.random() - .5) * 20, { vx: (Math.random() - .5) * 20, vy: -25 - Math.random() * 25, max: 1.6, size: 5 + Math.random() * 9 });
    cur.needs.propre = clamp(cur.needs.propre + 2.2, 0, 100);
    if (Math.random() < .25) tone(900 + rnd(600), .05, 'sine', .05, 0, 1.4);
  }
  setMood('love', .4);
  if (cur.needs.propre >= 100) { cur.needs.propre = 100; stopBath(true); markDirty(); }
  refreshUI();
}
function toggleSleep() {
  stopBath(); if (fx.mode === 'feed') { fx.mode = null; $('#tray').hidden = true; }
  if (cur.asleep) { cur.asleep = false; sfx.giggle(); jump(.3, .5); setMood('love', 1); }
  else { const before = cur.needs.energie; cur.asleep = true; sfx.yawn(); if (before < 60) soin('sleep'); }
  markDirty(); refreshUI();
}
function cleanPoop(i) {
  const q = cur.poops[i]; if (!q) return;
  const { W, H } = geo;
  cur.poops.splice(i, 1);
  for (let k = 0; k < 8; k++) spawn('sparkle', W / 2 + q.x * W * .4 + (Math.random() - .5) * 30, H * .86 + (Math.random() - .5) * 20, { vy: -40, max: .8, size: 6 + Math.random() * 5 });
  cur.needs.propre = clamp(cur.needs.propre + 8, 0, 100);
  sfx.sparkle(); soin('bath'); refreshUI();
}

/* ---- Œuf ---- */
function tapEgg() {
  cur.taps = (cur.taps || 0) + 1;
  fx.wob = 1; sfx.crack(); burst('sparkle', 3);
  if (cur.taps >= 7) hatch(); else markDirty();
}
function hatch() {
  cur.stage = 'baby'; cur.born = Date.now(); cur.last = Date.now(); cur.taps = 0;
  setHint(null); burst('confetti', 50); burst('sparkle', 12); sfx.fanfare(); jump(.6, .6); setMood('love', 2);
  saveNow(); refreshUI();
  setTimeout(() => showOv({ art: '', title: `Coucou ! Je m'appelle ${cur.name} !`, buttons: [{ label: 'Bonjour !', fn: closeOverlays }] }), 1100);
}

/* ---- Mini-jeu des étoiles ---- */
const game = { on: false, t: 0, dur: 25, stars: [], caught: 0, spawnT: 0 };
function tryPlay() {
  if (cur.needs.energie < 20) { setMood('no', 1.2); sfx.no(); spawn('zzz', geo.px + geo.R * .5, geo.py - geo.R * .8, { vx: 10, vy: -30, max: 1.6, size: 20 }); return; }
  stopBath(); $('#tray').hidden = true;
  fx.mode = 'game'; Object.assign(game, { on: true, t: 0, stars: [], caught: 0, spawnT: .3 });
  $('#gamebar').hidden = false; setHint('Attrape les étoiles !', false);
  setTimeout(() => { if (game.on && game.t > 2) setHint(null); }, 2500);
  sfx.fanfare(); refreshUI();
}
function updGame(dt) {
  game.t += dt; game.spawnT -= dt;
  if (game.t > 2.4) setHint(null);
  const { W, H } = geo, m = Math.min(W, H);
  if (game.spawnT <= 0 && game.t < game.dur - 1) {
    const gold = Math.random() < .12;
    game.stars.push({ x: W * (.1 + .8 * Math.random()), y: -30, vy: H * (.13 + .09 * Math.random()), r: m * (gold ? .07 : .058), rot: Math.random() * 6, gold, sway: Math.random() * 6 });
    game.spawnT = .55 + Math.random() * .45;
  }
  for (let i = game.stars.length - 1; i >= 0; i--) { const s = game.stars[i]; s.y += s.vy * dt; s.rot += dt; s.x += Math.sin(game.t * 2 + s.sway) * 12 * dt; if (s.y > H + 40) game.stars.splice(i, 1); }
  $('#gamebarFill').style.transform = `scaleX(${clamp(1 - game.t / game.dur, 0, 1)})`;
  if (game.t >= game.dur) endGame(false);
}
function gameTap(x, y) {
  let best = -1, bd = 1e9;
  game.stars.forEach((s, i) => { const d = Math.hypot(s.x - x, s.y - y); if (d < s.r * 1.8 && d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  const s = game.stars.splice(best, 1)[0];
  game.caught += s.gold ? 3 : 1;
  for (let k = 0; k < (s.gold ? 10 : 6); k++) spawn('sparkle', s.x, s.y, { vx: (Math.random() - .5) * 140, vy: (Math.random() - .5) * 140, max: .6, size: 5 + Math.random() * 6 });
  s.gold ? sfx.fanfare() : sfx.star(); jump(.3, .4); setMood('love', .5);
}
function endGame(silent) {
  if (!game.on) return;
  game.on = false; game.stars = []; $('#gamebar').hidden = true; setHint(null);
  if (silent || !cur) { fx.mode = null; return; }
  const n = cur.needs, got = Math.max(1, game.caught);
  cur.stars += got;
  const before = n.joie;
  n.joie = clamp(n.joie + 30, 0, 100); n.energie = clamp(n.energie - 10, 0, 100);
  if (before < 90 || got >= 5) soin('play');
  fx.mode = null;
  saveNow(); refreshUI(); sfx.fanfare(); burst('confetti', 30);
  const btns = [];
  if (n.energie >= 20) btns.push({ label: 'Encore !', fn: () => { closeOverlays(); tryPlay(); } });
  btns.push({ label: 'Fini', alt: btns.length > 0, fn: () => { closeOverlays(); checkEvolve(); } });
  showOv({ art: `<svg class="ic"><use href="#i-star"/></svg><span>+${got}</span>`, title: got >= 10 ? 'Champion des étoiles !' : 'Bravo !', buttons: btns });
}

/* ---- Boutique ---- */
function openShop() {
  stopBath(); $('#tray').hidden = true;
  fx.mode = 'shop'; $('#shop').hidden = false; sfx.tap(); renderShop(); refreshUI();
}
function renderShop() {
  const g = $('#shopGrid'); g.innerHTML = '';
  for (const it of ITEMS) {
    const owned = cur.items.includes(it.id), worn = cur.wearing === it.id;
    const b = document.createElement('button');
    b.className = 'item' + (owned ? ' owned' : '') + (worn ? ' worn' : '') + (!owned && cur.stars < it.price ? ' poor' : '');
    b.setAttribute('aria-label', it.id);
    b.innerHTML = '<canvas aria-hidden="true"></canvas><div class="price"></div>';
    const pr = b.querySelector('.price');
    if (owned) pr.textContent = worn ? 'Enlever' : 'Mettre';
    else pr.innerHTML = `<svg class="ic"><use href="#i-star"/></svg>${it.price}`;
    b.onclick = () => {
      if (owned) { cur.wearing = worn ? null : it.id; sfx.pop(); }
      else if (cur.stars >= it.price) { cur.stars -= it.price; cur.items.push(it.id); cur.wearing = it.id; sfx.fanfare(); burst('sparkle', 10); }
      else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx.no(); return; }
      markDirty(); renderShop(); refreshUI();
    };
    g.appendChild(b);
    requestAnimationFrame(() => drawPetFit(b.querySelector('canvas'), Object.assign({}, cur, { wearing: it.id, asleep: false }), 0, { mood: 'happy' }));
  }
}
$('#shopClose').onclick = () => { $('#shop').hidden = true; fx.mode = null; sfx.tap(); refreshUI(); };

/* ---- Fenêtres ---- */
function showOv({ art, title, buttons }) {
  $('#ovArt').innerHTML = art || ''; $('#ovArt').hidden = !art;
  $('#ovTitle').textContent = title;
  const bx = $('#ovBtns'); bx.innerHTML = '';
  for (const b of buttons) { const e = document.createElement('button'); e.className = 'big-btn' + (b.alt ? ' alt' : ''); e.textContent = b.label; e.onclick = () => { sfx.tap(); b.fn(); }; bx.appendChild(e); }
  $('#ov').hidden = false;
}
function closeOverlays() {
  $('#ov').hidden = true; $('#tray').hidden = true; $('#shop').hidden = true;
  if (fx.mode === 'shop' || fx.mode === 'feed') fx.mode = null;
  if (cur) refreshUI();
}

/* ---- Pointeur sur la scène ---- */
function localXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!cur || screen !== 'play') return;
  const [x, y] = localXY(e); fx.down = true; fx.pointer = [x, y];
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (fx.mode === 'game') { gameTap(x, y); return; }
  const { px, py, R, W, H } = geo;
  if (cur.stage === 'egg') { if (Math.hypot(x - px, y - py) < R * 1.2) tapEgg(); return; }
  if (fx.mode === 'bath') { rubAt(x, y, 12); return; }
  for (let i = 0; i < cur.poops.length; i++) {
    const qx = W / 2 + cur.poops[i].x * W * .4, qy = H * .86, s = Math.min(W, H) * .07;
    if (Math.hypot(x - qx, y - (qy - s * .3)) < s * 1.1) { cleanPoop(i); return; }
  }
  if (Math.hypot(x - px, y - py) < R * 1.1) hug();
});
cv.addEventListener('pointermove', e => {
  const [x, y] = localXY(e);
  if (fx.mode === 'bath' && fx.down && fx.pointer) rubAt(x, y, Math.hypot(x - fx.pointer[0], y - fx.pointer[1]));
  fx.pointer = [x, y];
});
const up = () => { fx.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { fx.down = false; if (fx.mode === 'bath') fx.pointer = null; });

/* ================= BOUCLE ================= */
let lastT = now(), lastTick = 0, lastSave = now(), prevBubbleCheck = 0;
function frame() {
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  if (screen === 'play' && cur) drawPlay(t, dt);
  else if (screen === 'create' && draft) {
    const c = $('#cvPreview');
    const { ctx, W, H } = fitCanvas(c); ctx.clearRect(0, 0, W, H);
    const R = Math.min(W * .22, H * .28);
    ctx.fillStyle = 'rgba(42,33,64,.1)'; ell(ctx, W / 2, H * .58 + R * .95, R * .8, R * .14); ctx.fill();
    drawPet(ctx, draft, W / 2, H * .58, R, t, { blink: (t % 4) < .12, wave: (t % 6) < 1 });
  }
  requestAnimationFrame(frame);
}
function drawPlay(t, dt) {
  const { ctx, W, H } = fitCanvas(cv);
  const sc = STAGE_SCALE[cur.stage] || 1;
  const R = Math.min(W * .22, H * .2) * sc;
  const inGame = fx.mode === 'game';
  const px = W / 2, py = inGame ? H * .8 : H * .64;
  geo = { W, H, px, py, R: inGame ? R * .75 : R };

  // horloge interne : une fois par seconde
  if (t - lastTick > 1) {
    lastTick = t;
    applyTime(cur, Date.now(), false);
    if (cur.stage !== 'egg') {
      if (cur.asleep) {
        cur.needs.energie = clamp(cur.needs.energie + 1.5, 0, 100);
        if (Math.random() < .5) spawn('zzz', px + R * .5, py - R * .9, { vx: 12, vy: -28, max: 1.8, size: 16 + Math.random() * 8 });
        if (cur.needs.energie >= 100 && !isNight()) { cur.asleep = false; sfx.giggle(); jump(.3, .5); markDirty(); }
      }
      if (fx.nextPoopAt && t > fx.nextPoopAt) { fx.nextPoopAt = 0; if (!cur.asleep && !inGame) addPoop(cur); }
    }
    refreshUI();
    if (t - lastSave > 45) { lastSave = t; saveNow(); }
  }

  drawScene(ctx, W, H, t, isNight());

  if (inGame) updGame(dt);

  if (!inGame) for (const q of cur.poops) drawPoop(ctx, W / 2 + q.x * W * .4, H * .86, Math.min(W, H) * .07, t);

  // saut et petits gestes
  if (t > fx.nextBlink) { fx.blinkUntil = t + .14; fx.nextBlink = t + 2.5 + Math.random() * 3; }
  if (t > fx.nextHop) { fx.nextHop = t + 4 + Math.random() * 4; if (!cur.asleep && cur.stage !== 'egg' && cur.needs.joie > 70 && !fx.mode) jump(.15, .35); }
  const jp = (t - fx.jumpStart) / fx.jumpDur;
  const dy = jp >= 0 && jp <= 1 ? -Math.sin(jp * Math.PI) * geo.R * fx.jumpH : 0;

  ctx.fillStyle = 'rgba(30,40,40,.14)'; ell(ctx, px, py + geo.R * .95, geo.R * .85 * (1 + dy / geo.R * .3), geo.R * .14); ctx.fill();

  if (cur.stage === 'egg') {
    fx.wob *= Math.pow(.02, dt);
    const wob = Math.sin(t * 30) * .18 * fx.wob + Math.sin(t * 1.5) * .03;
    drawEgg(ctx, cur, px, py - R * .1, Math.min(W * .22, H * .2) * .95, t, { wob, taps: cur.taps });
  } else {
    let mood = moodOf(cur);
    if (fx.mood && t < fx.moodUntil && !cur.asleep) mood = fx.mood; else fx.mood = null;
    if (inGame) mood = fx.mood || 'happy';
    const o = { mood, dy, blink: t < fx.blinkUntil, tilt: mood === 'no' ? Math.sin(t * 22) * .14 : 0, flap: dy < 0, wave: mood === 'love' && !inGame, look: inGame ? 0 : Math.sin(t * .7) };
    drawPet(ctx, cur, px, py, geo.R, t, o);
  }

  // nourriture volante
  if (fx.fly) {
    const f = fx.fly; f.t += dt; const k = clamp(f.t / f.dur, 0, 1), e = 1 - Math.pow(1 - k, 2);
    const tx = px, ty = py + geo.R * .1;
    const x = f.x0 + (tx - f.x0) * e, y = f.y0 + (ty - f.y0) * e - Math.sin(k * Math.PI) * 60;
    drawFood(ctx, f.f, x, y, geo.R * .35 * (1 - k * .4));
    if (k >= 1) { fx.fly = null; landFood(f.f); }
  }

  if (inGame) for (const s of game.stars) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.sin(s.rot) * .3);
    starPath(ctx, 0, 0, s.r, .48); ctx.fillStyle = s.gold ? '#ffb000' : '#ffd84a'; ctx.fill();
    ctx.strokeStyle = s.gold ? '#c06a00' : '#e0a100'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = '#5a3a00'; ell(ctx, -s.r * .2, -s.r * .05, s.r * .07, s.r * .09); ctx.fill(); ell(ctx, s.r * .2, -s.r * .05, s.r * .07, s.r * .09); ctx.fill();
    ctx.beginPath(); ctx.arc(0, s.r * .08, s.r * .14, .15 * Math.PI, .85 * Math.PI); ctx.strokeStyle = '#5a3a00'; ctx.lineWidth = 2; ctx.stroke();
    if (s.gold) { ctx.fillStyle = 'rgba(255,255,255,.8)'; starPath(ctx, s.r * .55, -s.r * .6, s.r * .22, .4, 4); ctx.fill(); }
    ctx.restore();
  }

  // éponge pendant le bain
  if (fx.mode === 'bath' && fx.pointer) {
    const [x, y] = fx.pointer;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-.2);
    ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#c99a00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-22, -14, 44, 28, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8c33f'; for (const [a, b] of [[-10, -4], [6, 5], [12, -6], [-4, 7]]) { ell(ctx, a, b, 3, 3); ctx.fill(); }
    ctx.restore();
  }

  // nuit : la scène s'assombrit quand il dort de jour
  if (cur.asleep && !isNight()) { ctx.fillStyle = 'rgba(28,30,90,.38)'; ctx.fillRect(0, 0, W, H); }

  updParts(dt); drawParts(ctx);
}

/* ================= DÉMARRAGE ================= */
function start(data) {
  data = data || {};
  if (data.cur && state.pets.some(p => p.id === data.cur)) openPet(data.cur);
  else { show('home'); renderHome(); }
  requestAnimationFrame(frame);
}
start();
})();
</script>
</body>
